events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_max_body_size 20M;

    # Variables de proxy communes
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;

    server {
        listen 80;
        server_name _;

        # service-biens : /api/biens/* -> http://service-biens:80/api/biens/*
        location /api/biens {
            proxy_pass http://service-biens:80;
        }

        # service-gestion : /api/gestion/* -> http://service-gestion:80/api/*
        location /api/gestion/ {
            proxy_pass http://service-gestion:80/api/;
        }

        # service-admin : /api/admin/* -> http://service-admin:80/api/*
        location /api/admin/ {
            proxy_pass http://service-admin:80/api/;
        }

        location / {
            return 404;
        }
    }
}
