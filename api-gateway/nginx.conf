events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name _;
        client_max_body_size 20M;

        location /api/biens/ {
            proxy_pass http://service-biens:9000/;
            proxy_set_header Host $host;
        }

        location /api/gestion/ {
            proxy_pass http://service-gestion:9000/;
            proxy_set_header Host $host;
        }

        location /api/admin/ {
            proxy_pass http://service-admin:9000/;
            proxy_set_header Host $host;
        }
    }
}
