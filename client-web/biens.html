<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventaire des Biens — SGPE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #F0F4F8; display: flex; min-height: 100vh; }
        
        /* Barre latérale */
        .sidebar { width: 260px; background: #59D2F3; color: white; padding: 24px; position: fixed; height: 100vh; }
        .sidebar h2 { font-size: 20px; margin-bottom: 40px; }
        .sidebar nav a { display: block; color: white; padding: 12px 16px; margin: 4px 0; border-radius: 8px; text-decoration: none; }
        .sidebar nav a:hover, .sidebar nav a.active { background: rgba(255,255,255,0.2); }
        
        /* Contenu principal */
        .main { margin-left: 260px; flex: 1; padding: 32px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .btn-primary { background: #59D2F3; color: white; }
        
        /* Tableau */
        .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid #E2E8F0; }
        th { background: #F8FAFC; font-weight: 600; color: #475569; }
        tr:hover { background: #F8FAFC; }
        
        /* Badges */
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 500; }
        .badge-success { background: #D1FAE5; color: #115E59; }
        .badge-warning { background: #FEF3C7; color: #92400E; }
        .badge-info { background: #DBEAFE; color: #1E40AF; }
    </style>
</head>
<body>

    <!-- Barre latérale -->
    <aside class="sidebar">
        <h2>🏛️ SGPE</h2>
        <nav>
            <a href="dashboard.html">📊 Tableau de bord</a>
            <a href="biens.html" class="active">📦 Inventaire des Biens</a>
            <a href="gestion.html">👥 Gestion</a>
            <a href="utilisateurs.html">👤 Utilisateurs</a>
            <a href="#" onclick="deconnecter()">🚪 Déconnexion</a>
        </nav>
    </aside>

    <!-- Contenu principal -->
    <main class="main">
        <div class="header">
            <div>
                <h1>Inventaire des Biens</h1>
                <p>Liste complète du patrimoine de l'État</p>
            </div>
            <button class="btn btn-primary" onclick="window.location.href='ajouter-bien.html'">+ Ajouter un bien</button>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Désignation</th>
                        <th>Catégorie</th>
                        <th>État</th>
                        <th>Localisation</th>
                        <th>Valeur</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Les données s'affichent ici automatiquement -->
                </tbody>
            </table>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            if (!requireAuth()) return;
            afficherUtilisateur();

            const res = await SGPE.get('biens', '/biens', { per_page: 100 });
            const biens = (res.ok && res.data && res.data.data) ? res.data.data : [];
            const tbody = document.getElementById('table-body');

            if (biens.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#888;">Aucun bien enregistré</td></tr>';
                return;
            }

            tbody.innerHTML = biens.map(bien => {
                let badgeClass = 'badge-success';
                if (bien.etat === 'Moyen') badgeClass = 'badge-warning';
                if (bien.etat === 'Dégradé' || bien.etat === 'Hors service') badgeClass = 'badge-info';

                return `
                    <tr>
                        <td><strong>${echapper(bien.designation)}</strong></td>
                        <td>${echapper(bien.categorie)}</td>
                        <td><span class="badge ${badgeClass}">${echapper(bien.etat)}</span></td>
                        <td>${echapper(bien.emplacement || '—')}</td>
                        <td>${formaterFCFA(bien.valeur)}</td>
                    </tr>
                `;
            }).join('');
        });
    </script>
</body>
</html>
