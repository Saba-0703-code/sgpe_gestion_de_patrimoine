<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGPE — Tableau de Bord</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        :root {
            --primaire: #00a896;
            --foncee: #008080;
            --claire: #e6f7f5;
            --texte: #334443;
            --gris: #f4f6f6;
        }
        body { display: flex; min-height: 100vh; background: var(--gris); }

        /* Barre latérale */
        .sidebar {
            width: 260px;
            background: white;
            border-right: 1px solid #e0e0e0;
            padding: 20px 0;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }
        .sidebar .logo {
            padding: 20px 25px;
            font-size: 22px;
            font-weight: bold;
            color: var(--foncee);
            border-bottom: 1px solid #eee;
            margin-bottom: 15px;
        }
        .sidebar nav a {
            display: flex;
            align-items: center;
            padding: 14px 25px;
            color: var(--texte);
            text-decoration: none;
            transition: background 0.2s;
        }
        .sidebar nav a.actif {
            background: var(--claire);
            color: var(--primaire);
            border-left: 4px solid var(--primaire);
        }
        .sidebar nav a:hover:not(.actif) { background: #f0f0f0; }
        .sidebar nav a span { margin-left: 10px; }

        /* Contenu principal */
        .contenu { flex: 1; margin-left: 260px; padding: 25px; }
        .entete {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .entete h1 { font-size: 26px; color: var(--texte); }
        .utilisateur { display: flex; align-items: center; gap: 10px; }
        .utilisateur .nom { font-weight: 600; }
        .deconnexion {
            padding: 8px 16px;
            background: #e53935;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        /* Cartes statistiques */
        .grille-cartes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 35px;
        }
        .carte {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .carte .valeur { font-size: 32px; font-weight: bold; color: var(--foncee); }
        .carte .etiquette { color: #777; margin-top: 5px; font-size: 14px; }

        /* Section tableau et graphique */
        .grille-contenu {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
        }
        .boite {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .boite h3 { font-size: 18px; margin-bottom: 20px; color: var(--texte); }

        /* Tableau */
        table { width: 100%; border-collapse: collapse; }
        table th, table td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        table th { color: #666; font-weight: 600; }
        .etat {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .etat.bon { background: #e8f5e9; color: #2e7d32; }
        .etat.moyen { background: #fff8e1; color: #f57c00; }
        .etat.mauvais { background: #ffebee; color: #c62828; }

        /* Responsive */
        @media(max-width: 1200px) {
            .grille-cartes { grid-template-columns: repeat(2, 1fr); }
            .grille-contenu { grid-template-columns: 1fr; }
        }
        @media(max-width: 768px) {
            .sidebar { width: 70px; }
            .sidebar .logo { font-size: 0; padding: 20px 5px; }
            .sidebar nav a span { display: none; }
            .contenu { margin-left: 70px; }
            .grille-cartes { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <script>
        const API_URL = "http://localhost:8000";

        // Vérifie si connecté
        function verifierConnexion() {
            const token = localStorage.getItem('token');
             <!-- Contenu principal -->
            if (!token) {
             <main class="contenu">
                window.location.href = 'login.html';

            }
            const utilisateur = JSON.parse(localStorage.getItem('utilisateur') || '{}');
            document.getElementById('nom-utilisateur').textContent = 

                utilisateur.prenom + ' ' + utilisateur.nom || 'Utilisateur';
        }

        function deconnecter() {
            localStorage.removeItem('token');
            localStorage.removeItem('utilisateur');

            window.location.href = 'login.html';
        }

        // Charger les données
        async function chargerDonnees() {
            try {
                const reponse = await fetch(`${API_URL}/service-biens/api/biens`, {
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
                });
                
                if (reponse.ok) {
                    const biens = await reponse.json();
                    mettreAJourTableau(biens);
                    mettreAJourStatistiques(biens);
                }
            } catch (e) {
                console.log("API non disponible — données de démonstration");
                chargerDonneesDemo();
            }
        }

        function mettreAJourTableau(biens) {
            const tbody = document.querySelector('#table-derniers tbody');
            if (biens.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#999;padding:20px;">Aucun bien enregistré</td></tr>';
                return;
            }
                <tr>
                    <td>${b.reference || '-'}</td>
                    <td>${b.nom}</td>
                    <td>${b.categorie}</td>
                    <td><span class="etat ${b.etat === 'Bon' ? 'bon' : b.etat === 'Moyen' ? 'moyen' : 'mauvais'}">${b.etat}</span></td>
                </tr>
            `).join('');
        }

        function mettreAJourStatistiques(biens) {
            document.getElementById('total-biens').textContent = biens.length;
            const total = biens.reduce((sum, b) => sum + parseFloat(b.valeur || 0), 0);
            document.getElementById('valeur-totale').textContent = new Intl.NumberFormat('fr-FR').format(total) + ' FCFA';
            document.getElementById('en-utilisation').textContent = Math.floor(biens.length * 0.75);
            document.getElementById('etat-mauvais').textContent = biens.filter(b => b.etat === 'Mauvais').length;
        }

        function chargerDonneesDemo() {
            document.getElementById('total-biens').textContent = '24';
            document.getElementById('valeur-totale').textContent = '45 850 000 FCFA';
            document.getElementById('en-utilisation').textContent = '18';
            document.getElementById('etat-mauvais').textContent = '3';
            const derniers = biens.slice(-5).reverse();
            document.querySelector('#table-derniers tbody').innerHTML = `
            tbody.innerHTML = derniers.map(b => `
                <tr><td>EQ-024</td><td>Ordinateur portable</td><td>Équipement</td><td><span class="etat bon">Bon</span></td></tr>

                <tr><td>MB-018</td><td>Table de réunion</td><td>Mobilier</td><td><span class="etat bon">Bon</span></td></tr>

                <tr><td>VE-007</td><td>Véhicule de service</td><td>Véhicule</td><td><span class="etat moyen">Moyen</span></td></tr>

                <tr><td>IM-003</td><td>Imprimante salle B</td><td>Équipement</td><td><span class="etat mauvais">Mauvais</span></td></tr>
            `;

        }


        // Initialisation

        verifierConnexion();

        chargerDonnees();
    </script>
