<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGPE — Inventaire des Biens</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        :root {
            --primaire: #17C9B2; --foncee: #1D84F5; --claire: #E7FAF8;
            --texte: #334443; --gris: #f4f6f6; --gris-fonce: #888;
        }
        body { display: flex; min-height: 100vh; background: var(--gris); }
        
        /* Barre latérale */
        .sidebar {
            width: 260px; background: white; border-right: 1px solid #e0e0e0;
            padding: 20px 0; position: fixed; height: 100vh;
        }
        .sidebar .logo {
            padding: 20px 25px; font-size: 22px; font-weight: bold;
            color: var(--foncee); border-bottom: 1px solid #eee; margin-bottom: 15px;
        }
        .sidebar nav a {
            display: flex; align-items: center; padding: 14px 25px;
            color: var(--texte); text-decoration: none; transition: background 0.2s;
        }
        .sidebar nav a.actif {
            background: var(--claire); color: var(--primaire);
            border-left: 4px solid var(--primaire);
        }
        .sidebar nav a:hover:not(.actif) { background: #f0f0f0; }
        .sidebar nav a span { margin-left: 10px; }

        /* Contenu principal */
        .contenu { flex: 1; margin-left: 260px; padding: 25px; }
        .entete {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; flex-wrap: wrap; gap: 15px;
        }
        .entete h1 { font-size: 26px; color: var(--texte); }
        .utilisateur { display: flex; align-items: center; gap: 10px; }
        .deconnexion {
            padding: 8px 16px; background: #e53935; color: white;
            border: none; border-radius: 6px; cursor: pointer;
        }
        .actions { display: flex; gap: 10px; }
        .btn {
            padding: 10px 18px; border-radius: 6px; border: none;
            cursor: pointer; font-weight: 500; text-decoration: none; display: inline-block;
        }
        .btn-primaire { background: var(--primaire); color: white; }
        .btn-primaire:hover { background: #0E8F80; }
        .btn-secondaire { background: #e0e0e0; color: var(--texte); }

        /* Filtres */
        .filtres {
            background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px;
            display: flex; gap: 15px; flex-wrap: wrap;
        }
        .filtres input, .filtres select {
            padding: 10px 14px; border: 1px solid #ddd; border-radius: 6px;
            font-size: 14px; min-width: 180px;
        }
        .filtres input:focus, .filtres select:focus { outline: none; border-color: var(--primaire); }

        /* Tableau */
        .boite-tableau { background: white; padding: 20px; border-radius: 8px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        table th, table td {
            padding: 14px 12px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px;
        }
        table th { background: #fafafa; color: #666; font-weight: 600; }
        .etat {
            padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 500;
        }
        .etat.bon { background: #e8f5e9; color: #2e7d32; }
        .etat.moyen { background: #fff8e1; color: #f57c00; }
        .etat.mauvais { background: #ffebee; color: #c62828; }
        .actions-ligne a { margin-right: 8px; color: var(--primaire); text-decoration: none; font-size: 13px; }
        .vide { text-align: center; padding: 40px; color: var(--gris-fonce); }

        /* Responsive */
        @media(max-width: 768px) {
            .sidebar { width: 70px; }
            .sidebar .logo { font-size: 0; padding: 20px 5px; }
            .sidebar nav a span { display: none; }
            .contenu { margin-left: 70px; }
        }
    </style>
</head>
<body>
    <!-- Barre latérale -->
    <aside class="sidebar">
        <div class="logo">SGPE</div>
        <nav>
            <a href="dashboard.html">🏠 <span>Tableau de bord</span></a>
            <a href="inventaire.html" class="actif">📋 <span>Inventaire</span></a>
            <a href="ajouter-bien.html">➕ <span>Ajouter un bien</span></a>
            <a href="affectations.html">🔄 <span>Affectations</span></a>
            <a href="utilisateurs.html">👥 <span>Utilisateurs</span></a>
            <a href="rapports.html">📊 <span>Rapports</span></a>
        </nav>
    </aside>

    <!-- Contenu principal -->
    <main class="contenu">
        <div class="entete">
            <h1>Inventaire des Biens</h1>
            <div class="utilisateur">
                <span id="nom-utilisateur">Utilisateur</span>
                <button class="deconnexion" onclick="deconnecter()">Déconnexion</button>
            </div>
        </div>

        <div class="entete">
            <a href="ajouter-bien.html" class="btn btn-primaire">➕ Ajouter un Bien</a>
        </div>

        <!-- Filtres -->
        <div class="filtres">
            <input type="text" id="recherche" placeholder="Rechercher un bien...">
            <select id="filtre-categorie">
                <option value="">Toutes les catégories</option>
                <option>Matériel informatique</option>
                <option>Mobilier</option>
                <option>Véhicule</option>
                <option>Équipement</option>
                <option>Autre</option>
            </select>
            <select id="filtre-etat">
                <option value="">Tous les états</option>
                <option>Neuf</option>
                <option>Bon</option>
                <option>Moyen</option>
                <option>Dégradé</option>
                <option>Hors service</option>
            </select>
        </div>

        <!-- Tableau -->
        <div class="boite-tableau">
            <table>
                <thead>
                    <tr>
                        <th>Référence</th>
                        <th>Nom du bien</th>
                        <th>Catégorie</th>
                        <th>État</th>
                        <th>Valeur</th>
                        <th>Localisation</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="corps-inventaire">
                    <tr><td colspan="7" class="vide">Chargement...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        let tousBiens = [];

        document.addEventListener('DOMContentLoaded', async function() {
            if (!requireAuth()) return;
            afficherUtilisateur();
            await chargerBiens();
        });

        // Charger les biens depuis l'API
        async function chargerBiens() {
            const res = await SGPE.get('biens', '/biens', { per_page: 100 });
            tousBiens = (res.ok && res.data && res.data.data) ? res.data.data : [];
            filtrerBiens();
        }

        function classeEtat(etat) {
            if (etat === 'Neuf' || etat === 'Bon') return 'bon';
            if (etat === 'Moyen') return 'moyen';
            return 'mauvais';
        }

        // Afficher les biens dans le tableau
        function afficherBiens(liste) {
            const tbody = document.getElementById('corps-inventaire');
            if (liste.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="vide">Aucun bien ne correspond à votre recherche</td></tr>';
                return;
            }
            tbody.innerHTML = liste.map(b => `
                <tr>
                    <td><strong>${echapper(b.numero_serie || ('N°' + b.id))}</strong></td>
                    <td>${echapper(b.designation)}</td>
                    <td>${echapper(b.categorie)}</td>
                    <td><span class="etat ${classeEtat(b.etat)}">${echapper(b.etat)}</span></td>
                    <td>${formaterFCFA(b.valeur)}</td>
                    <td>${echapper(b.emplacement || '—')}</td>
                    <td class="actions-ligne">
                        <a href="fiche-bien.html?id=${b.id}">📄 Fiche</a>
                    </td>
                </tr>
            `).join('');
        }

        // Filtrer les biens
        function filtrerBiens() {
            const recherche = document.getElementById('recherche').value.toLowerCase();
            const categorie = document.getElementById('filtre-categorie').value;
            const etat = document.getElementById('filtre-etat').value;

            const resultat = tousBiens.filter(b => {
                const correspondRecherche = !recherche ||
                    (b.numero_serie && b.numero_serie.toLowerCase().includes(recherche)) ||
                    (b.designation && b.designation.toLowerCase().includes(recherche));
                const correspondCategorie = !categorie || b.categorie === categorie;
                const correspondEtat = !etat || b.etat === etat;
                return correspondRecherche && correspondCategorie && correspondEtat;
            });

            afficherBiens(resultat);
        }

        // Événements des filtres
        document.getElementById('recherche').addEventListener('input', filtrerBiens);
        document.getElementById('filtre-categorie').addEventListener('change', filtrerBiens);
        document.getElementById('filtre-etat').addEventListener('change', filtrerBiens);
    </script>
</body>
</html>
