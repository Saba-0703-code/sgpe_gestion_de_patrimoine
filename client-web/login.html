<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — SGPE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e3a5f 0%, #2c5282 100%);
        }
        .login-card {
            background: white;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        .login-card h1 {
            text-align: center;
            color: #1e3a5f;
            margin-bottom: 8px;
            font-size: 24px;
        }
        .login-card p {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
            transition: border 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #2c5282;
        }
        button {
            width: 100%;
            padding: 13px;
            background: #1e3a5f;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #2c5282; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
        .alert.error { background: #fee2e2; color: #dc2626; display: block; }
        .logo { text-align: center; margin-bottom: 20px; }
        .logo span {
            font-size: 32px;
            font-weight: bold;
            color: #1e3a5f;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo"><span>🏛️ SGPE</span></div>
        <h1>Bienvenue</h1>
        <p>Connectez-vous pour accéder au système</p>
        
        <div id="alert" class="alert"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Adresse email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="mot_de_passe" required>
            </div>
            <button type="submit" id="submitBtn">Se connecter</button>
        </form>
    </div>

    <script type="module">
        import ApiClient from './js/api.js';
        const api = new ApiClient('admin');

        const form = document.getElementById('loginForm');
        const alertBox = document.getElementById('alert');
        const submitBtn = document.getElementById('submitBtn');

        function showAlert(message, type = 'error') {
            alertBox.textContent = message;
            alertBox.className = `alert ${type}`;
            setTimeout(() => { alertBox.style.display = 'none'; }, 5000);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = 'Connexion...';
            alertBox.style.display = 'none';

            const formData = {
                email: document.getElementById('email').value,
                mot_de_passe: document.getElementById('password').value
            };

            const result = await api.post('/login', formData);

            if (result.success) {
                localStorage.setItem('auth_token', result.data.token);
                localStorage.setItem('auth_user', JSON.stringify(result.data.utilisateur));
                window.location.href = 'dashboard.html';
            } else {
                showAlert(result.message || 'Échec de la connexion');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Se connecter';
            }
        });
    </script>
</body>
</html>
