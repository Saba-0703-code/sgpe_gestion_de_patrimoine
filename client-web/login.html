<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — SGPE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Inter', Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #FFFFFF;
            position: relative;
            overflow: hidden;
        }

        /* 🌍 Partie gauche : Illustration */
        .illustration {
            position: absolute;
            left: 0;
            top: 0;
            width: 55%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #EBF5FE 0%, #FFFFFF 100%);
        }

        .illustration-content {
            text-align: center;
            padding: 40px;
        }

        .globe {
            font-size: 120px;
            margin-bottom: 24px;
        }

        .illustration-content h2 {
            font-size: 26px;
            font-weight: 600;
            color: #1565C0;
            margin-bottom: 12px;
        }

        .illustration-content p {
            font-size: 16px;
            color: #64748B;
            max-width: 400px;
            line-height: 1.6;
        }

        /* 🔐 Partie droite : Formulaire de connexion */
        .login-container {
            position: absolute;
            right: 8%;
            top: 50%;
            transform: translateY(-50%);
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            padding: 48px 36px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            font-size: 40px;
            margin-bottom: 8px;
        }

        .logo-section h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1565C0;
            letter-spacing: 1px;
        }

        .login-card h2 {
            text-align: center;
            font-size: 22px;
            color: #1E293B;
            margin-bottom: 8px;
        }

        .sous-titre {
            text-align: center;
            color: #64748B;
            font-size: 15px;
            margin-bottom: 36px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #CBD5E1;
            border-radius: 8px;
            font-size: 15px;
            transition: border 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #1565C0;
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.1);
        }

        .btn-connexion {
            width: 100%;
            padding: 14px;
            background: #1565C0;
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-connexion:hover {
            background: #0E8F80;
        }

        .btn-connexion:active {
            transform: scale(0.98);
        }

        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }

        .alert.error {
            background: #FEF2F2;
            color: #DC2626;
            border: 1px solid #FECACA;
            display: block;
        }

        .alert.success {
            background: #F0FDF4;
            color: #166534;
            border: 1px solid #BBF7D0;
            display: block;
        }

        .info-demo {
            margin-top: 24px;
            padding: 16px;
            background: #F8FAFC;
            border-radius: 8px;
            font-size: 13px;
            color: #64748B;
            line-height: 1.6;
        }

        .info-demo strong {
            color: #1565C0;
        }

        /* 📱 Responsive */
        @media (max-width: 900px) {
            .illustration {
                display: none;
            }
            .login-container {
                position: static;
                transform: none;
                padding: 20px;
                max-width: 420px;
                margin: 0 auto;
            }
        }
    </style>
    <link rel="stylesheet" href="css/sombre.css">
    <script src="js/theme.js"></script>
</head>
<body>

    <!-- 🌍 Partie gauche : Illustration -->
    <div class="illustration">
        <div class="illustration-content">
            <div class="globe">🏛️</div>
            <h2>Système de Gestion du Patrimoine de l'État</h2>
            <p>Gérez efficacement les biens et actifs publics — centralisation, suivi et traçabilité en toute simplicité.</p>
        </div>
    </div>

    <!-- 🔐 Partie droite : Formulaire de connexion -->
    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <div class="logo-icon">🏛️</div>
                <h1>SGPE</h1>
            </div>
            <h2>Bienvenue</h2>
            <p class="sous-titre">Connectez-vous pour accéder au système</p>

            <div id="alert" class="alert"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Adresse email</label>
                    <input type="email" id="email" name="email" required placeholder="votre@email.tg">
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="mot_de_passe" required placeholder="••••••••">
                </div>
                <button type="submit" id="submitBtn" class="btn-connexion">Se connecter</button>
            </form>

            <div class="info-demo" id="info-demo">
                <strong>Compte de démonstration :</strong><br>
                Email : admin@sgpe.tg<br>
                Mot de passe : SGPE@Admin2026!
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        // Déjà connecté -> tableau de bord
        if (estConnecte()) {
            window.location.href = 'dashboard.html';
        }

        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('loginForm');
            const alertDiv = document.getElementById('alert');
            const submitBtn = document.getElementById('submitBtn');

            form.addEventListener('submit', async function(e) {
                e.preventDefault();

                alertDiv.style.display = 'none';
                alertDiv.className = 'alert';

                const email = document.getElementById('email').value.trim();
                const motDePasse = document.getElementById('password').value;

                if (!email || !motDePasse) {
                    alertDiv.textContent = 'Veuillez remplir tous les champs.';
                    alertDiv.classList.add('error');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'Connexion en cours...';

                const res = await SGPE.post('admin', '/login', {
                    email: email,
                    mot_de_passe: motDePasse
                });

                submitBtn.disabled = false;
                submitBtn.textContent = 'Se connecter';

                if (res.ok && res.data && res.data.token) {
                    SGPE.setToken(res.data.token);
                    localStorage.setItem('utilisateur', JSON.stringify(res.data.utilisateur));
                    localStorage.setItem('connecte', 'oui');
                    window.location.href = 'dashboard.html';
                } else {
                    const msg = (res.data && (res.data.message || (res.data.errors && Object.values(res.data.errors).flat()[0])))
                        || 'Identifiants incorrects.';
                    alertDiv.textContent = '❌ ' + msg;
                    alertDiv.classList.add('error');
                }
            });
        });
    </script>
</body>
</html>
