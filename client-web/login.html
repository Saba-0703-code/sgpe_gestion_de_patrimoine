<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGPE — Connexion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #00a896 0%, #008080 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: white;
            padding: 45px 35px;
            border-radius: 14px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.18);
            width: 100%;
            max-width: 420px;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo-section h1 {
            color: #008080;
            font-size: 26px;
            margin-bottom: 5px;
        }

        .logo-section p {
            color: #777;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #334443;
            font-weight: 500;
            font-size: 15px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00a896;
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            background: #00a896;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-login:hover {
            background: #008c7c;
        }

        .message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            display: none;
            font-size: 14px;
        }

        .message.erreur {
            background: #ffebee;
            color: #c62828;
            display: block;
        }

        .message.succes {
            background: #e8f5e9;
            color: #2e7d32;
            display: block;
        }

        .infos-bas {
            margin-top: 25px;
            text-align: center;
            font-size: 13px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-section">
            <h1>🔐 SGPE</h1>
            <p>Système de Gestion du Patrimoine de l'État</p>
        </div>

        <form id="form-login">
            <div class="form-group">
                <label for="email">Adresse email</label>
                <input type="email" id="email" name="email" placeholder="votre@email.tg" required>
            </div>

            <div class="form-group">
                <label for="mot_de_passe">Mot de passe</label>
                <input type="password" id="mot_de_passe" name="mot_de_passe" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">Se connecter</button>

            <div id="message" class="message"></div>
        </form>

        <div class="infos-bas">
            © 2026 SGPE — Tous droits réservés
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:8000/service-admin/api";

        // Redirige si déjà connecté
        if (localStorage.getItem('token')) {
            window.location.href = 'dashboard.html';
        }

        const form = document.getElementById('form-login');
        const messageDiv = document.getElementById('message');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Réinitialise le message
            messageDiv.style.display = 'none';
            messageDiv.className = 'message';

            const donnees = {
                email: document.getElementById('email').value,
                mot_de_passe: document.getElementById('mot_de_passe').value
            };

            try {
                const reponse = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(donnees)
                });

                const resultat = await reponse.json();

                if (reponse.ok) {
                    // Connexion réussie — sauvegarde les infos
                    localStorage.setItem('token', resultat.token);
                    localStorage.setItem('utilisateur', JSON.stringify(resultat.utilisateur));
                    
                    messageDiv.textContent = "Connexion réussie ! Redirection...";
                    messageDiv.classList.add('succes');
                    
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1200);
                } else {
                    messageDiv.textContent = resultat.message || "Erreur de connexion";
                    messageDiv.classList.add('erreur');
                }
            } catch (erreur) {
                // Mode démo quand l'API n'est pas encore disponible
                messageDiv.textContent = "Mode démo — cliquez pour entrer";
                messageDiv.classList.add('succes');
                
                // Création d'une session démo locale
                localStorage.setItem('utilisateur', JSON.stringify({
                    id: 1,
                    nom: 'Administrateur',
                    prenom: 'SGPE',
                    email: 'admin@sgpe.tg',
                    role: 'admin'
                }));
                localStorage.setItem('token', 'demo-token-sgpe');
                
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);
            }
        });
    </script>
</body>
</html>
