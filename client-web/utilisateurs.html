<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGPE — Gestion des Utilisateurs</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        :root {
            --primaire: #00a896; --foncee: #008080; --claire: #e6f7f5;
            --texte: #334443; --gris: #f4f6f6; --gris-fonce: #888;
            --erreur: #e53935;
        }
        body { display: flex; min-height: 100vh; background: var(--gris); }

        /* Barre latérale */
        .sidebar {
            width: 260px; background: white; border-right: 1px solid #e0e0e0;
            padding: 20px 0; position: fixed; height: 100vh;
        }
        .sidebar .logo {
            padding: 20px 25px; font-size: 22px; font-weight: bold;
            color: var(--foncee); border-bottom: 1px solid #eee; margin-bottom: 15px;
        }
        .sidebar nav a {
            display: flex; align-items: center; padding: 14px 25px;
            color: var(--texte); text-decoration: none; transition: background 0.2s;
        }
        .sidebar nav a.actif {
            background: var(--claire); color: var(--primaire);
            border-left: 4px solid var(--primaire);
        }
        .sidebar nav a:hover:not(.actif) { background: #f0f0f0; }
        .sidebar nav a span { margin-left: 10px; }

        /* Contenu principal */
        .contenu { flex: 1; margin-left: 260px; padding: 25px; }
        .entete {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; flex-wrap: wrap; gap: 15px;
        }
        .entete h1 { font-size: 26px; color: var(--texte); }
        .utilisateur { display: flex; align-items: center; gap: 10px; }
        .deconnexion {
            padding: 8px 16px; background: var(--erreur); color: white;
            border: none; border-radius: 6px; cursor: pointer;
        }

        .btn {
            padding: 10px 18px; border-radius: 6px; border: none; cursor: pointer;
            font-weight: 500; text-decoration: none; display: inline-block;
            transition: background 0.2s;
        }
        .btn-primaire { background: var(--primaire); color: white; }
        .btn-primaire:hover { background: #009484; }
        .btn-secondaire { background: #e0e0e0; color: var(--texte); }
        .btn-sm { padding: 6px 12px; font-size: 13px; }
        .btn-danger { background: var(--erreur); color: white; }

        /* Modal */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); align-items: center; justify-content: center;
            z-index: 1000;
        }
        .modal.ouvert { display: flex; }
        .modal-content {
            background: white; padding: 30px; border-radius: 10px; max-width: 500px;
            width: 90%; max-height: 90vh; overflow-y: auto;
        }
        .modal-content h2 { font-size: 20px; margin-bottom: 20px; color: var(--texte); }
        .fermer {
            float: right; background: none; border: none; font-size: 22px;
            cursor: pointer; color: #999; margin-top: -10px;
        }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { margin-bottom: 15px; }
        .form-group.full-width { grid-column: 1 / -1; }
        .form-group label {
            display: block; margin-bottom: 6px; color: var(--texte);
            font-weight: 500; font-size: 14px;
        }
        .form-group input, .form-group select {
            width: 100%; padding: 10px 12px; border: 1px solid #ddd;
            border-radius: 6px; font-size: 14px;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none; border-color: var(--primaire);
        }
        .actions-modal {
            margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end;
        }

        /* Filtres */
        .filtres {
            background: white; padding: 18px; border-radius: 8px; margin-bottom: 20px;
            display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
        }
        .filtres input, .filtres select {
            padding: 9px 12px; border: 1px solid #ddd; border-radius: 6px;
            font-size: 14px; min-width: 160px;
        }
        .filtres input:focus, .filtres select:focus {
            outline: none; border-color: var(--primaire);
        }

        /* Tableau */
        .boite-tableau {
            background: white; padding: 20px; border-radius: 8px; overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; }
        table th, table td {
            padding: 12px 10px; text-align: left; border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        table th { background: #fafafa; color: #666; font-weight: 600; }

        /* Badges */
        .role { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
        .role.admin { background: #e8f5e9; color: #2e7d32; }
        .role.utilisateur { background: #e3f2fd; color: #1565c0; }
        .role.lecteur { background: #f3e5f5; color: #7b1fa2; }

        .statut { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
        .statut.actif { background: #e8f5e9; color: #2e7d32; }
        .statut.inactif { background: #f5f5f5; color: #757575; }

        .vide { text-align: center; padding: 40px; color: var(--gris-fonce); }
        .avatar {
            width: 36px; height: 36px; background: var(--claire); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: var(--primaire); flex-shrink: 0;
        }

        /* Responsive */
        @media(max-width: 900px) {
            .sidebar { width: 70px; }
            .sidebar .logo { font-size: 0; padding: 20px 5px; }
            .sidebar nav a span { display: none; }
            .contenu { margin-left: 70px; padding: 15px; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- Vérification de connexion -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const connecte = localStorage.getItem('connecte');
            if (!connecte || connecte !== 'oui') {
                alert('Veuillez vous connecter d\'abord');
                window.location.href = 'login.html';
                return;
            }

            // Afficher le nom de l'utilisateur connecté
            const utilisateur = JSON.parse(localStorage.getItem('utilisateur') || '{}');
            if (utilisateur.prenom && utilisateur.nom) {
                document.getElementById('nom-utilisateur').textContent = utilisateur.prenom + ' ' + utilisateur.nom;
            }

            chargerUtilisateurs();
        });

        function deconnecter() {
            localStorage.removeItem('connecte');
            localStorage.removeItem('utilisateur');
            window.location.href = 'login.html';
        }

        const API_URL = "http://localhost:8000/service-admin/api";
        let tousUtilisateurs = [];
        let utilisateurEnEdition = null;

        function initiales(p, n) {
            return (p.charAt(0) + n.charAt(0)).toUpperCase();
        }

        function ouvrirModal(id = null) {
            utilisateurEnEdition = id;
            document.getElementById('modal-utilisateur').classList.add('ouvert');
            
            if (id) {
                const u = tousUtilisateurs.find(item => item.id === id);
                document.getElementById('modal-titre').textContent = "Modifier l'utilisateur";
                document.getElementById('prenom').value = u.prenom;
                document.getElementById('nom').value = u.nom;
                document.getElementById('email').value = u.email;
                document.getElementById('role').value = u.role;
                document.getElementById('service').value = u.service;
                document.getElementById('motdepasse').value = '';
                document.getElementById('motdepasse').placeholder = 'Laisser vide pour ne pas modifier';
            } else {
                document.getElementById('modal-titre').textContent = "Ajouter un utilisateur";
                document.getElementById('form-utilisateur').reset();
                document.getElementById('motdepasse').placeholder = 'Minimum 8 caractères';
            }
        }

        function fermerModal() {
            document.getElementById('modal-utilisateur').classList.remove('ouvert');
            document.getElementById('form-utilisateur').reset();
            utilisateurEnEdition = null;
        }

        function supprimerUtilisateur(id) {
            if (confirm('⚠️ Êtes-vous sûr de vouloir supprimer cet utilisateur ?')) {
                tousUtilisateurs = tousUtilisateurs.filter(u => u.id !== id);
                afficherUtilisateurs(tousUtilisateurs);
                alert('✅ Utilisateur supprimé !');
            }
        }

        async function chargerUtilisateurs() {
            tousUtilisateurs = [
                { id: 1, prenom: 'Admin', nom: 'SGPE', email: 'admin@sgpe.tg', role: 'admin', service: 'Direction', statut: 'actif', derniereConnexion: "Aujourd'hui" },
                { id: 2, prenom: 'Kouassi', nom: 'Yao', email: 'y.kouassi@sgpe.tg', role: 'utilisateur', service: 'Comptabilité', statut: 'actif', derniereConnexion: "Hier" },
                { id: 3, prenom: 'Koné', nom: 'Aminata', email: 'a.kone@sgpe.tg', role: 'utilisateur', service: 'Ressources Humaines', statut: 'actif', derniereConnexion: "Il y a 3 jours" },
                { id: 4, prenom: 'Traoré', nom: 'Moussa', email: 'm.traore@sgpe.tg', role: 'lecteur', service: 'Logistique', statut: 'inactif', derniereConnexion: "Il y a 2 mois" }
            ];
            afficherUtilisateurs(tousUtilisateurs);
        }

        function afficherUtilisateurs(liste) {
            const tbody = document.getElementById('corps-tableau');
            if (liste.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="vide">Aucun utilisateur ne correspond à votre recherche</td></tr>';
                return;
            }
            tbody.innerHTML = liste.map(u => `
                <tr>
                    <td>
                        <div style="display:flex;align-items:center;gap:10px;">
                            <div class="avatar">${initiales(u.prenom, u.nom)}</div>
                            <div>
                                <div style="font-weight:500;">${u.prenom} ${u.nom}</div>
                            </div>
                        </div>
                    </td>
                    <td>${u.email}</td>
                    <td><span class="role ${u.role}">${u.role === 'admin' ? 'Administrateur' : u.role === 'utilisateur' ? 'Utilisateur' : 'Lecteur'}</span></td>
                    <td>${u.service}</td>
                    <td><span class="statut ${u.statut}">${u.statut === 'actif' ? 'Actif' : 'Inactif'}</span></td>
                    <td style="font-size:13px;color:var(--gris-fonce);">${u.derniereConnexion}</td>
                    <td>
                        <button class="btn btn-sm btn-secondaire" onclick="ouvrirModal(${u.id})" title="Modifier">✏️</button>
                        <button class="btn btn-sm btn-danger" onclick="supprimerUtilisateur(${u.id})" title="Supprimer">🗑️</button>
                    </td>
                </tr>
            `).join('');
        }

        function filtrer() {
            const recherche = document.getElementById('recherche').value.toLowerCase();
            const role = document.getElementById('filtre-role').value;
            const statut = document.getElementById('filtre-statut').value;
            const filtre = tousUtilisateurs.filter(u => {
                return (!recherche || 
                    u.prenom.toLowerCase().includes(recherche) || 
                    u.nom.toLowerCase().includes(recherche) || 
                    u.email.toLowerCase().includes(recherche))
                    && (!role || u.role === role)
                    && (!statut || u.statut === statut);
            });
            afficherUtilisateurs(filtre);
        }

        document.getElementById('form-utilisateur').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const prenom = document.getElementById('prenom').value.trim();
            const nom = document.getElementById('nom').value.trim();
            const email = document.getElementById('email').value.trim();
            const role = document.getElementById('role').value;
            const service = document.getElementById('service').value.trim();
            const motdepasse = document.getElementById('motdepasse').value;

            if (!prenom || !nom || !email || !role) {
                alert('⚠️ Veuillez remplir tous les champs obligatoires.');
                return;
            }

            if (!utilisateurEnEdition && motdepasse.length < 8) {
                alert('⚠️ Le mot de passe doit contenir au moins 8 caractères.');
                return;
            }

            if (utilisateurEnEdition) {
                // Mode modification
                const idx = tousUtilisateurs.findIndex(u => u.id === utilisateurEnEdition);
                tousUtilisateurs[idx] = {
                    ...tousUtilisateurs[idx],
                    prenom, nom, email, role, service
                };
                alert('✅ Utilisateur modifié avec succès !');
            } else {
                // Mode ajout
                const nouvelUtilisateur = {
                    id: Date.now(),
                    prenom, nom, email, role, service,
                    statut: 'actif',
                    derniereConnexion: "Jamais connecté"
                };
                tousUtilisateurs.unshift(nouvelUtilisateur);
                alert('✅ Utilisateur ajouté avec succès !');
            }

            fermerModal();
            afficherUtilisateurs(tousUtilisateurs);
        });

        document.getElementById('recherche').addEventListener('input', filtrer);
        document.getElementById('filtre-role').addEventListener('change', filtrer);
        document.getElementById('filtre-statut').addEventListener('change', filtrer);
    </script>
