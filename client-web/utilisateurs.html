<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGPE — Gestion des Utilisateurs</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        :root {
            --primaire: #17C9B2; --foncee: #1D84F5; --claire: #E7FAF8;
            --texte: #334443; --gris: #f4f6f6; --gris-fonce: #888;
            --erreur: #e53935;
        }
        body { display: flex; min-height: 100vh; background: var(--gris); }

        /* Barre latérale */
        .sidebar {
            width: 260px; background: white; border-right: 1px solid #e0e0e0;
            padding: 20px 0; position: fixed; height: 100vh;
        }
        .sidebar .logo {
            padding: 20px 25px; font-size: 22px; font-weight: bold;
            color: var(--foncee); border-bottom: 1px solid #eee; margin-bottom: 15px;
        }
        .sidebar nav a {
            display: flex; align-items: center; padding: 14px 25px;
            color: var(--texte); text-decoration: none; transition: background 0.2s;
        }
        .sidebar nav a.actif {
            background: var(--claire); color: var(--primaire);
            border-left: 4px solid var(--primaire);
        }
        .sidebar nav a:hover:not(.actif) { background: #f0f0f0; }
        .sidebar nav a span { margin-left: 10px; }

        /* Contenu principal */
        .contenu { flex: 1; margin-left: 260px; padding: 25px; }
        .entete {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; flex-wrap: wrap; gap: 15px;
        }
        .entete h1 { font-size: 26px; color: var(--texte); }
        .utilisateur { display: flex; align-items: center; gap: 10px; }
        .deconnexion {
            padding: 8px 16px; background: var(--erreur); color: white;
            border: none; border-radius: 6px; cursor: pointer;
        }

        .btn {
            padding: 10px 18px; border-radius: 6px; border: none; cursor: pointer;
            font-weight: 500; text-decoration: none; display: inline-block;
            transition: background 0.2s;
        }
        .btn-primaire { background: var(--primaire); color: white; }
        .btn-primaire:hover { background: #0E8F80; }
        .btn-secondaire { background: #e0e0e0; color: var(--texte); }
        .btn-sm { padding: 6px 12px; font-size: 13px; }
        .btn-danger { background: var(--erreur); color: white; }

        /* Modal */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); align-items: center; justify-content: center;
            z-index: 1000;
        }
        .modal.ouvert { display: flex; }
        .modal-content {
            background: white; padding: 30px; border-radius: 10px; max-width: 500px;
            width: 90%; max-height: 90vh; overflow-y: auto;
        }
        .modal-content h2 { font-size: 20px; margin-bottom: 20px; color: var(--texte); }
        .fermer {
            float: right; background: none; border: none; font-size: 22px;
            cursor: pointer; color: #999; margin-top: -10px;
        }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { margin-bottom: 15px; }
        .form-group.full-width { grid-column: 1 / -1; }
        .form-group label {
            display: block; margin-bottom: 6px; color: var(--texte);
            font-weight: 500; font-size: 14px;
        }
        .form-group input, .form-group select {
            width: 100%; padding: 10px 12px; border: 1px solid #ddd;
            border-radius: 6px; font-size: 14px;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none; border-color: var(--primaire);
        }
        .actions-modal {
            margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end;
        }
        .message {
            margin-top: 15px; padding: 12px; border-radius: 6px; display: none;
        }
        .message.erreur { background: #ffebee; color: #c62828; display: block; }

        /* Filtres */
        .filtres {
            background: white; padding: 18px; border-radius: 8px; margin-bottom: 20px;
            display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
        }
        .filtres input, .filtres select {
            padding: 9px 12px; border: 1px solid #ddd; border-radius: 6px;
            font-size: 14px; min-width: 160px;
        }
        .filtres input:focus, .filtres select:focus {
            outline: none; border-color: var(--primaire);
        }

        /* Tableau */
        .boite-tableau {
            background: white; padding: 20px; border-radius: 8px; overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; }
        table th, table td {
            padding: 12px 10px; text-align: left; border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        table th { background: #fafafa; color: #666; font-weight: 600; }

        /* Badges */
        .role { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
        .role.admin { background: #e8f5e9; color: #2e7d32; }
        .role.gestionnaire { background: #fff8e1; color: #f57c00; }
        .role.utilisateur { background: #e3f2fd; color: #1565c0; }

        .statut { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
        .statut.actif { background: #e8f5e9; color: #2e7d32; }
        .statut.inactif { background: #f5f5f5; color: #757575; }

        .vide { text-align: center; padding: 40px; color: var(--gris-fonce); }
        .avatar {
            width: 36px; height: 36px; background: var(--claire); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: var(--primaire); flex-shrink: 0;
        }

        /* Responsive */
        @media(max-width: 900px) {
            .sidebar { width: 70px; }
            .sidebar .logo { font-size: 0; padding: 20px 5px; }
            .sidebar nav a span { display: none; }
            .contenu { margin-left: 70px; padding: 15px; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <script src="js/api.js"></script>
    <script>
        let tousUtilisateurs = [];
        let utilisateurEnEdition = null;
        const estAdmin = () => (getUtilisateur() || {}).role === 'admin';

        document.addEventListener('DOMContentLoaded', async function() {
            if (!requireAuth()) return;
            afficherUtilisateur();
            await chargerUtilisateurs();

            if (!estAdmin()) {
                document.getElementById('zone-admin').style.display = 'none';
            }
        });

        function deconnexion() { deconnecter(); }

        function initiales(p, n) {
            return ((p || '?').charAt(0) + (n || '?').charAt(0)).toUpperCase();
        }

        function libelleRole(role) {
            return { admin: 'Administrateur', gestionnaire: 'Gestionnaire', utilisateur: 'Utilisateur' }[role] || role;
        }

        async function chargerUtilisateurs() {
            const res = await SGPE.get('admin', '/utilisateurs', { per_page: 100 });
            tousUtilisateurs = (res.ok && res.data && res.data.data) ? res.data.data : [];
            filtrer();
        }

        function ouvrirModal(id = null) {
            utilisateurEnEdition = id;
            const form = document.getElementById('form-utilisateur');
            form.reset();
            document.getElementById('message-form').style.display = 'none';
            document.getElementById('modal-titre').textContent = id ? "Modifier l'utilisateur" : "Ajouter un utilisateur";

            const mdp = document.getElementById('motdepasse');
            if (id) {
                const u = tousUtilisateurs.find(item => item.id === id);
                if (!u) return;
                document.getElementById('prenom').value = u.prenom || '';
                document.getElementById('nom').value = u.nom || '';
                document.getElementById('email').value = u.email || '';
                document.getElementById('telephone').value = u.telephone || '';
                document.getElementById('role').value = u.role || 'utilisateur';
                document.getElementById('statut').value = u.statut || 'Actif';
                mdp.value = '';
                mdp.placeholder = 'Laisser vide pour ne pas modifier';
                mdp.required = false;
            } else {
                document.getElementById('statut').value = 'Actif';
                mdp.placeholder = 'Minimum 8 caractères';
                mdp.required = true;
            }
            document.getElementById('modal-utilisateur').classList.add('ouvert');
        }

        function fermerModal() {
            document.getElementById('modal-utilisateur').classList.remove('ouvert');
            utilisateurEnEdition = null;
        }

        async function supprimerUtilisateur(id) {
            if (!confirm('⚠️ Êtes-vous sûr de vouloir supprimer cet utilisateur ?')) return;
            const res = await SGPE.del('admin', '/utilisateurs/' + id);
            if (res.ok) {
                await chargerUtilisateurs();
            } else {
                alert((res.data && res.data.message) || 'Erreur lors de la suppression.');
            }
        }

        function filtrer() {
            const recherche = document.getElementById('recherche').value.toLowerCase();
            const role = document.getElementById('filtre-role').value;
            const statut = document.getElementById('filtre-statut').value;

            const liste = tousUtilisateurs.filter(u =>
                (!recherche ||
                    (u.prenom || '').toLowerCase().includes(recherche) ||
                    (u.nom || '').toLowerCase().includes(recherche) ||
                    (u.email || '').toLowerCase().includes(recherche))
                && (!role || u.role === role)
                && (!statut || u.statut === statut)
            );
            afficherUtilisateurs(liste);
        }

        function afficherUtilisateurs(liste) {
            const tbody = document.getElementById('corps-tableau');
            if (liste.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="vide">Aucun utilisateur ne correspond à votre recherche</td></tr>';
                return;
            }
            const admin = estAdmin();
            tbody.innerHTML = liste.map(u => `
                <tr>
                    <td>
                        <div style="display:flex;align-items:center;gap:10px;">
                            <div class="avatar">${initiales(u.prenom, u.nom)}</div>
                            <div style="font-weight:500;">${echapper(u.prenom)} ${echapper(u.nom)}</div>
                        </div>
                    </td>
                    <td>${echapper(u.email)}</td>
                    <td>${echapper(u.telephone || '—')}</td>
                    <td><span class="role ${echapper(u.role)}">${libelleRole(u.role)}</span></td>
                    <td><span class="statut ${u.statut === 'Actif' ? 'actif' : 'inactif'}">${u.statut === 'Actif' ? 'Actif' : 'Inactif'}</span></td>
                    <td>${admin ? `
                        <button class="btn btn-sm btn-secondaire" onclick="ouvrirModal(${u.id})" title="Modifier">✏️</button>
                        <button class="btn btn-sm btn-danger" onclick="supprimerUtilisateur(${u.id})" title="Supprimer">🗑️</button>
                    ` : '—'}</td>
                </tr>
            `).join('');
        }

        document.getElementById('form-utilisateur').addEventListener('submit', async function(e) {
            e.preventDefault();
            const msg = document.getElementById('message-form');
            msg.style.display = 'none';

            const payload = {
                prenom: document.getElementById('prenom').value.trim(),
                nom: document.getElementById('nom').value.trim(),
                email: document.getElementById('email').value.trim(),
                telephone: document.getElementById('telephone').value.trim() || null,
                role: document.getElementById('role').value,
                statut: document.getElementById('statut').value
            };
            const motdepasse = document.getElementById('motdepasse').value;
            if (motdepasse) payload.mot_de_passe = motdepasse;

            if (!payload.prenom || !payload.nom || !payload.email) {
                msg.textContent = '⚠️ Veuillez remplir tous les champs obligatoires.';
                msg.className = 'message erreur';
                return;
            }
            if (!utilisateurEnEdition && (!motdepasse || motdepasse.length < 8)) {
                msg.textContent = '⚠️ Le mot de passe doit contenir au moins 8 caractères.';
                msg.className = 'message erreur';
                return;
            }

            const res = utilisateurEnEdition
                ? await SGPE.put('admin', '/utilisateurs/' + utilisateurEnEdition, payload)
                : await SGPE.post('admin', '/utilisateurs', payload);

            if (res.ok) {
                fermerModal();
                await chargerUtilisateurs();
            } else {
                let texte = 'Erreur lors de l\'enregistrement.';
                if (res.data && res.data.errors) {
                    texte = Object.values(res.data.errors).flat().join(' ');
                } else if (res.data && res.data.message) {
                    texte = res.data.message;
                }
                msg.textContent = '❌ ' + texte;
                msg.className = 'message erreur';
            }
        });

        document.getElementById('recherche').addEventListener('input', filtrer);
        document.getElementById('filtre-role').addEventListener('change', filtrer);
        document.getElementById('filtre-statut').addEventListener('change', filtrer);
    </script>

    <!-- Barre latérale -->
    <aside class="sidebar">
        <div class="logo">SGPE</div>
        <nav>
            <a href="dashboard.html">🏠 <span>Tableau de bord</span></a>
            <a href="inventaire.html">📋 <span>Inventaire</span></a>
            <a href="ajouter-bien.html">➕ <span>Ajouter un bien</span></a>
            <a href="affectations.html">🔄 <span>Affectations</span></a>
            <a href="utilisateurs.html" class="actif">👥 <span>Utilisateurs</span></a>
            <a href="rapports.html">📊 <span>Rapports</span></a>
            <a href="#" onclick="deconnecter(); return false;">🚪 <span>Déconnexion</span></a>
        </nav>
    </aside>

    <!-- Contenu principal -->
    <main class="contenu">
        <div class="entete">
            <h1>Gestion des Utilisateurs</h1>
            <div class="utilisateur">
                <span id="nom-utilisateur">Utilisateur</span>
                <button class="deconnexion" onclick="deconnecter()">Déconnexion</button>
            </div>
        </div>

        <div class="entete" id="zone-admin">
            <button class="btn btn-primaire" onclick="ouvrirModal()">➕ Nouvel Utilisateur</button>
        </div>

        <!-- Filtres -->
        <div class="filtres">
            <input type="text" id="recherche" placeholder="Rechercher un utilisateur...">
            <select id="filtre-role">
                <option value="">Tous les rôles</option>
                <option value="admin">Administrateur</option>
                <option value="gestionnaire">Gestionnaire</option>
                <option value="utilisateur">Utilisateur</option>
            </select>
            <select id="filtre-statut">
                <option value="">Tous les statuts</option>
                <option value="Actif">Actif</option>
                <option value="Inactif">Inactif</option>
            </select>
        </div>

        <!-- Tableau -->
        <div class="boite-tableau">
            <table>
                <thead>
                    <tr>
                        <th>Utilisateur</th>
                        <th>Email</th>
                        <th>Téléphone</th>
                        <th>Rôle</th>
                        <th>Statut</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="corps-tableau">
                    <tr><td colspan="6" class="vide">Chargement...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal Formulaire -->
    <div id="modal-utilisateur" class="modal">
        <div class="modal-content">
            <button class="fermer" onclick="fermerModal()">&times;</button>
            <h2 id="modal-titre">Ajouter un utilisateur</h2>
            <form id="form-utilisateur">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="prenom">Prénom *</label>
                        <input type="text" id="prenom" required>
                    </div>
                    <div class="form-group">
                        <label for="nom">Nom *</label>
                        <input type="text" id="nom" required>
                    </div>
                    <div class="form-group full-width">
                        <label for="email">Email *</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label for="telephone">Téléphone</label>
                        <input type="text" id="telephone">
                    </div>
                    <div class="form-group">
                        <label for="role">Rôle *</label>
                        <select id="role" required>
                            <option value="utilisateur">Utilisateur</option>
                            <option value="gestionnaire">Gestionnaire</option>
                            <option value="admin">Administrateur</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="statut">Statut</label>
                        <select id="statut">
                            <option value="Actif">Actif</option>
                            <option value="Inactif">Inactif</option>
                        </select>
                    </div>
                    <div class="form-group full-width">
                        <label for="motdepasse">Mot de passe</label>
                        <input type="password" id="motdepasse" minlength="8" placeholder="Minimum 8 caractères" required>
                    </div>
                </div>
                <div id="message-form" class="message"></div>
                <div class="actions-modal">
                    <button type="button" class="btn btn-secondaire" onclick="fermerModal()">Annuler</button>
                    <button type="submit" class="btn btn-primaire">💾 Enregistrer</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
