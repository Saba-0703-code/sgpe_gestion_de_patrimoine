

networks:
  sgpe-reseau:
    driver: bridge

volumes:
  db_biens_data:
  db_gestion_data:
  db_admin_data:

services:
  db-biens:
    image: postgres:17-alpine
    container_name: sgpe-db-biens
    restart: unless-stopped
    environment:
      POSTGRES_DB: db_biens
      POSTGRES_USER: sgpe_user
      POSTGRES_PASSWORD: secret_pour_developpement
    volumes:
      - db_biens_data:/var/lib/postgresql/data
    ports:
      - "5431:5432"
    networks:
      - sgpe-reseau
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgpe_user -d db_biens"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-gestion:
    image: postgres:17-alpine
    container_name: sgpe-db-gestion
    restart: unless-stopped
    environment:
      POSTGRES_DB: db_gestion
      POSTGRES_USER: sgpe_user
      POSTGRES_PASSWORD: secret_pour_developpement
    volumes:
      - db_gestion_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - sgpe-reseau
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgpe_user -d db_gestion"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-admin:
    image: postgres:17-alpine
    container_name: sgpe-db-admin
    restart: unless-stopped
    environment:
      POSTGRES_DB: db_admin
      POSTGRES_USER: sgpe_user
      POSTGRES_PASSWORD: secret_pour_developpement
    volumes:
      - db_admin_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - sgpe-reseau
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgpe_user -d db_admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  service-biens:
    build:
      context: ./service-biens
      dockerfile: Dockerfile
    container_name: sgpe-service-biens
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./service-biens:/var/www/html
    ports:
      - "8001:9000"
    environment:
      DB_HOST: db-biens
      DB_PORT: 5432
      DB_DATABASE: db_biens
      DB_USERNAME: sgpe_user
      DB_PASSWORD: secret_pour_developpement
    depends_on:
      db-biens:
        condition: service_healthy
    networks:
      - sgpe-reseau

  service-gestion:
    build:
      context: ./service-gestion
      dockerfile: Dockerfile
    container_name: sgpe-service-gestion
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./service-gestion:/var/www/html
    ports:
      - "8002:9000"
    environment:
      DB_HOST: db-gestion
      DB_PORT: 5432
      DB_DATABASE: db_gestion
      DB_USERNAME: sgpe_user
      DB_PASSWORD: secret_pour_developpement
    depends_on:
      db-gestion:
        condition: service_healthy
    networks:
      - sgpe-reseau

  service-admin:
    build:
      context: ./service-admin
      dockerfile: Dockerfile
    container_name: sgpe-service-admin
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./service-admin:/var/www/html
    ports:
      - "8003:9000"
    environment:
      DB_HOST: db-admin
      DB_PORT: 5432
      DB_DATABASE: db_admin
      DB_USERNAME: sgpe_user
      DB_PASSWORD: secret_pour_developpement
    depends_on:
      db-admin:
        condition: service_healthy
    networks:
      - sgpe-reseau

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: sgpe-api-gateway
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - service-biens
      - service-gestion
      - service-admin
    networks:
      - sgpe-reseau

  client-web:
    build:
      context: ./client-web
      dockerfile: Dockerfile
    container_name: sgpe-client-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./client-web:/usr/share/nginx/html
    depends_on:
      - api-gateway
    networks:
      - sgpe-reseau
